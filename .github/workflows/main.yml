name: Build & Release Obfuscated Binary

on:
  workflow_dispatch:
    inputs:
      obfuscation:
        description: '混淆方式'
        required: true
        default: 'upx'
        type: choice
        options:
          - none
          - upx
      publish_release:
        description: '发布到 GitHub Release'
        required: true
        default: true
        type: boolean
      release_tag:
        description: 'Release 标签 (留空则自动生成)'
        required: false
        type: string

  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # ========== 1. 直接用 cl 编译（完全绕过恶意 MSBuild Task）==========
    - name: Build with cl (Bypass Malicious vcxproj)
      run: |
        # 定位 VS 安装路径并初始化 x64 编译环境
        $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
                    -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
                    -property installationPath
        if (-not $vsPath) { throw "❌ Visual Studio C++ tools not found!" }
        
        Write-Host "🔧 VS Path: $vsPath"
        
        # 通过 vcvarsall.bat 初始化环境变量（包括 cl.exe 到 PATH）
        $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvarsall.bat"
        cmd /c "`"$vcvars`" x64 && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
                [System.Environment]::SetEnvironmentVariable($matches[1], $matches[2], 'Process')
            }
        }
        
        # 验证 cl 可用
        $clPath = Get-Command cl -ErrorAction SilentlyContinue
        if (-not $clPath) { throw "❌ cl.exe still not in PATH after vcvarsall!" }
        Write-Host "✅ cl.exe: $($clPath.Source)"
        
        # 编译参数严格匹配 vcxproj Release|x64 配置
        # /MT         = MultiThreaded (静态CRT，匹配 RuntimeLibrary)
        # /GS-        = BufferSecurityCheck=false
        # /O2         = MaxSpeed
        # /W0         = WarningLevel=Off (避免警告干扰)
        # /D NDEBUG   = Release 预处理宏
        # /D _CONSOLE = 控制台应用宏
        # /link /SUBSYSTEM:WINDOWS /ENTRY:mainCRTStartup /ALIGN:512
        #             = 精确匹配 vcxproj 链接器设置
        # /MANIFEST:NO = GenerateManifest=false
        
        $srcDir = "ElevatorShellCode"
        cl /EHsc /O2 /GS- /W0 /MT /D "NDEBUG" /D "_CONSOLE" `
           /Fe:ElevatorShellCode.exe `
           "$srcDir\Source.cpp" `
           /I"$srcDir" `
           /link /LIBPATH:"$srcDir" `
                 NoCRTtest1.lib `
                 user32.lib kernel32.lib `
                 /SUBSYSTEM:WINDOWS `
                 /ENTRY:mainCRTStartup `
                 /ALIGN:512 `
                 /MANIFEST:NO `
                 /INCREMENTAL:NO
        
        if ($LASTEXITCODE -ne 0) { throw "❌ cl compilation failed! Exit: $LASTEXITCODE" }
        
        if (-not (Test-Path "ElevatorShellCode.exe")) { throw "❌ Output binary not found!" }
        Write-Host "✅ Build succeeded: ElevatorShellCode.exe ($([math]::Round((Get-Item ElevatorShellCode.exe).Length/1KB,1)) KB)"
      shell: pwsh

    - name: Locate Binary
      id: find-binary
      run: |
        $exe = Get-Item "ElevatorShellCode.exe" -ErrorAction Stop
        echo "raw_path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
        echo "binary_name=$($exe.BaseName)" >> $env:GITHUB_OUTPUT
        Write-Host "✅ Binary: $($exe.FullName)"
      shell: pwsh

    # ========== 2. UPX 混淆 ==========
    - name: Obfuscate with UPX
      id: upx
      if: ${{ github.event.inputs.obfuscation == 'upx' || (github.event.inputs.obfuscation == '' && startsWith(github.ref, 'refs/tags/')) }}
      run: |
        $upxVersion = "4.2.4"
        Invoke-WebRequest -Uri "https://github.com/upx/upx/releases/download/v$upxVersion/upx-$upxVersion-win64.zip" `
                          -OutFile ".\upx.zip" -UseBasicParsing
        Expand-Archive -Path ".\upx.zip" -DestinationPath ".\upx-bin" -Force
        $upxExe = Get-ChildItem ".\upx-bin" -Recurse -Filter "upx.exe" | Select-Object -First 1

        New-Item -ItemType Directory -Force -Path ".\obfuscated" | Out-Null
        $raw = "${{ steps.find-binary.outputs.raw_path }}"
        $out = ".\obfuscated\${{ steps.find-binary.outputs.binary_name }}_obf.exe"

        & $upxExe.FullName --best --lzma --force --no-backup -o "$out" "$raw"
        if (-not (Test-Path $out)) { throw "❌ UPX failed!" }

        $rawSize = [math]::Round((Get-Item $raw).Length / 1KB, 1)
        $obfSize = [math]::Round((Get-Item $out).Length / 1KB, 1)
        Write-Host "✅ UPX: ${rawSize}KB → ${obfSize}KB"
        echo "obf_path=$out" >> $env:GITHUB_OUTPUT
      shell: pwsh

    - name: Skip Obfuscation
      if: ${{ github.event.inputs.obfuscation == 'none' }}
      run: |
        New-Item -ItemType Directory -Force -Path ".\obfuscated" | Out-Null
        Copy-Item "${{ steps.find-binary.outputs.raw_path }}" ".\obfuscated\"
        Write-Host "⏭️ Obfuscation skipped"
      shell: pwsh

    # ========== 3. 版本号 ==========
    - name: Determine Version
      id: version
      run: |
        if ("${{ github.event.inputs.release_tag }}" -ne "") {
            $tag = "${{ github.event.inputs.release_tag }}"
        } elseif (startsWith(github.ref, 'refs/tags/')) {
            $tag = "${{ github.ref }}" -replace 'refs/tags/', ''
        } else {
            $tag = "dev-" + (Get-Date -Format "yyyyMMdd-HHmmss")
        }
        echo "tag=$tag" >> $env:GITHUB_OUTPUT
        Write-Host "🏷️ Tag: $tag"
      shell: pwsh

    # ========== 4. 打包并发布 Release ==========
    - name: Package Artifact
      run: |
        $files = Get-ChildItem ".\obfuscated\*.exe"
        if (-not $files) { throw "❌ No binary in obfuscated folder!" }
        Compress-Archive -Path ".\obfuscated\*" -DestinationPath ".\release.zip" -Force
        Write-Host "📦 Package: release.zip ($([math]::Round((Get-Item .\release.zip).Length/1KB,1)) KB)"
      shell: pwsh

    - name: Publish to GitHub Release
      if: ${{ github.event.inputs.publish_release != 'false' || startsWith(github.ref, 'refs/tags/') }}
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: "ShellCode Elevator ${{ steps.version.outputs.tag }}"
        files: release.zip
        draft: false
        prerelease: ${{ contains(steps.version.outputs.tag, 'dev') }}
        body: |
          ## 🔧 Automated Build

          | Item | Value |
          |------|-------|
          | **Version** | `${{ steps.version.outputs.tag }}` |
          | **Commit** | `${{ github.sha }}` |
          | **Platform** | Windows x64 |
          | **Obfuscation** | `${{ github.event.inputs.obfuscation || 'upx' }}` |
          | **Triggered by** | @${{ github.actor }} |

          > ⚠️ For educational & authorized testing only.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
